<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · DATARA</title>
</head>
<body>
  <main>
    <h1>Sign in to DATARA</h1>
    <p>This local account is provisioned by the operator. Public registration is not available.</p>
    {% if form.errors %}<p role="alert">Sign-in failed. Check the account name and password.</p>{% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
